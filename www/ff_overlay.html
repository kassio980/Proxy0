<!doctype html><html lang=pt-BR><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>OKAIDA OFICIAL · CONTROLE</title>
<style>
:root{--fundo:rgba(5,8,22,.94);--borda:#7c3aed;--roxo:#a78bfa;--verde:#22c55e;--vermelho:#ef4444;--texto:#e2e8f0}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:transparent;padding:0}
.janela{
  width:310px;background:var(--fundo);border:2px solid var(--borda);border-radius:16px;padding:14px;
  backdrop-filter:blur(18px);box-shadow:0 0 40px rgba(124,58,237,.4);position:fixed;top:120px;left:12px;z-index:99999
}
.cabecalho{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;cursor:move}
.cabecalho h3{color:var(--roxo);font-size:15px;font-weight:800}
.fechar{background:var(--vermelho);border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;cursor:pointer}
.grupo{margin-bottom:10px}
.linha{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:rgba(124,58,237,.08);border-radius:8px;margin:4px 0}
.switch{width:44px;height:22px;border-radius:22px;background:#333;position:relative;transition:.2s;cursor:pointer}
.switch.ligado{background:var(--verde)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.2s}
.switch.ligado::after{transform:translateX(22px)}
.botao{width:100%;padding:10px;border-radius:8px;border:0;font-weight:700;margin-top:4px;cursor:pointer}
.botao.vermelho{background:linear-gradient(90deg,#ef4444,#f87171);color:#fff}
.botao.roxo{background:linear-gradient(90deg,#7c3aed,#a78bfa);color:#fff}
</style></head><body>

<div class=janela id=janela>
  <div class=cabecalho>
    <h3>🔰 OKAIDA OFICIAL</h3>
    <div class=fechar onclick=this.parentElement.parentElement.style.display='none'>×</div>
  </div>

  <div class=grupo>
    <div class=linha>🔴 FULL VERMELHO<div class=switch onclick=toggleFuncao('full',this)></div></div>
    <div class=linha>🎯 LINHA VERMELHA<div class=switch onclick=toggleFuncao('linha',this)></div></div>
    <div class=linha>💀 AUTO CABEÇA<div class=switch onclick=toggleFuncao('hs',this)></div></div>
    <div class=linha>🔇 SILENT AIM<div class=switch onclick=toggleFuncao('silent',this)></div></div>
    <div class=linha>🎯 SEM RECUO<div class=switch onclick=toggleFuncao('recuo',this)></div></div>
    <div class=linha>🧱 VER ATRÁS DE PAREDE<div class=switch onclick=toggleFuncao('esp',this)></div></div>
  </div>

  <button class="botao roxo" onclick=window.open('/dash','_blank')>⚙️ ABRIR PAINEL COMPLETO</button>
  <button class="botao vermelho" onclick=window.location.reload()>🔄 RECARREGAR JANELA</button>
</div>

<script>
function toggleFuncao(nome,el){
  el.classList.toggle('ligado')
  fetch(`/api/hack/${nome}/${el.classList.contains('ligado')?1:0}`)
}
// Faz janela arrastar
const jan = document.getElementById('janela');let mov=false,x,y
jan.addEventListener('mousedown',e=>{mov=true;x=e.clientX-jan.offsetLeft;y=e.clientY-jan.offsetTop})
document.addEventListener('mousemove',e=>{if(!mov)return;jan.style.left=(e.clientX-x)+'px';jan.style.top=(e.clientY-y)+'px'})
document.addEventListener('mouseup',()=>mov=false)
// Abre automaticamente em 2s
setTimeout(()=>jan.style.display='block',2000)
</script>
</body></html>
