services:
  - type: web
    name: proxy0
    env: python
    region: sao-paulo
    plan: free
    buildCommand: pip install --upgrade pip setuptools wheel && pip install --no-cache-dir -r requirements.txt
    startCommand: gunicorn --worker-class sync --workers 1 --threads 100 --timeout 120 --bind 0.0.0.0:$PORT main:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: "10000"
      - key: RENDER
        value: "1"
      - key: CHAVE_MESTRA
        value: okaida2026
      - key: TEMPO_MAX_HORAS
        value: "7"
      - key: ANTIBAN_ATIVO
        value: "1"
      - key: REGIAO
        value: BR
      - key: MODO
        value: PRODUCAO
      - key: SECRET_KEY
        value: okaida-proxy-2026-secret-mestra-render
    autoDeploy: true
