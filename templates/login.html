<!doctype html><html lang=pt-BR><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>🔐 PROXY OKAIDA — ACESSO</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--bg:#050816;--card:#0b1030;--borda:#1e1b4b;--roxo:#7c3aed;--azul:#38bdf8;--texto:#e2e8f0}
body{margin:0;background:
  radial-gradient(1200px 600px at 80% -10%, rgba(124,58,237,.25), transparent 60%),
  radial-gradient(900px 500px at -10% 110%, rgba(56,189,248,.18), transparent 55%),
  linear-gradient(180deg, var(--bg), #070b1f);
color:var(--texto);font-family:Inter,system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{width:min(420px,92%);background:linear-gradient(180deg,#0d1338,#0a0f2e);border:1px solid var(--borda);border-radius:18px;padding:36px 32px;box-shadow:0 30px 80px rgba(124,58,237,.25)}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.hex{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--roxo),#4338ca);display:flex;align-items:center;justify-content:center}
h1{font-size:20px;margin:0;background:linear-gradient(90deg,#fff,#c4b5fd);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{opacity:.6;font-size:12px;letter-spacing:2px;text-transform:uppercase;margin-bottom:24px}
input{width:100%;padding:14px 16px;background:#070a20;border:1px solid #1e1b4b;border-radius:10px;color:#fff;font-size:15px;letter-spacing:3px;outline:none;margin:6px 0 14px}
input:focus{border-color:var(--roxo);box-shadow:0 0 0 3px rgba(124,58,237,.2)}
button{width:100%;padding:14px;background:linear-gradient(135deg,var(--roxo),#4f46e5);color:#fff;border:0;border-radius:10px;font-weight:700;letter-spacing:2px;cursor:pointer;text-transform:uppercase;font-size:13px}
button:hover{transform:translateY(-1px);box-shadow:0 12px 30px rgba(124,58,237,.45)}
.erro{color:#f87171;font-size:13px;min-height:18px;margin-top:8px}
.blink{animation:b 1s steps(2) infinite}@keyframes b{50%{opacity:0}}
</style></head><body>
<div class=card>
  <div class=logo><div class=hex><svg width=22 height=22 viewBox="0 0 24 24" fill=none stroke=#fff stroke-width=2.2><path d="M12 2L3 7v10l9 5 9-5V7z"/><path d="M3 7l9 5 9-5"/></svg></div>
    <div><h1>PROXY OKAIDA <span class=blink>_</span></h1><div class=sub>Sistema Exclusivo · Acesso Restrito</div></div></div>
  <form method=post>
    <div style=opacity:.7;font-size:12px;letter-spacing:2px;text-transform:uppercase>Chave de Acesso</div>
    <input name=key type=password placeholder="••••••••••••" autocomplete=off autofocus>
    <button type=submit>▶ ENTRAR NO SISTEMA</button>
    <div class=erro id=e></div>
  </form>
</div>
<script>if(location.search.includes('e=1'))document.getElementById('e').textContent='❌ Chave inválida'</script>
</body></html>
